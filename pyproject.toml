[project]
name = "rest-api-drf"
version = "0.1.0"
description = "Build A Django Rest API with the DRF and deploy on algolia"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "algoliasearch>=4.31.0",
    "algoliasearch-django>=4.0,<5.0",
    "django>=5.2.7",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]
